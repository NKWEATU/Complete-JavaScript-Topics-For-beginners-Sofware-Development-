<!DOCTYPE html>
<html>
<head>

    <!-- Defines the character encoding -->
    <meta charset="UTF-8">

    <!-- Sets the webpage title -->
    <title>Student Information System</title>

</head>
<body>

<!-- Main heading -->
<h1>Student Information System</h1>

<!-- Section for displaying student information -->
<h2>Student Details</h2>

<!-- Display student name -->
<p id="studentName"></p>

<!-- Display student age -->
<p id="studentAge"></p>

<!-- Display student course -->
<p id="studentCourse"></p>

<!-- Display student registration status -->
<p id="studentStatus"></p>

<!-- Display student phone number -->
<p id="studentPhone"></p>

<!-- Display student address -->
<p id="studentAddress"></p>

<!-- Display the data types -->
<h2>JavaScript Data Types</h2>

<p id="dataTypes"></p>

<!-- Connect the external JavaScript file -->
<script src="script.js"></script>

</body>
</html>
