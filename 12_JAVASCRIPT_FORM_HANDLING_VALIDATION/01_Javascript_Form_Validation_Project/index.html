
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <!-- Connecting external CSS file -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>Student Registration Form</h1>

    <p>Please complete the form below.</p>

    <!-- Student Registration Form -->
    <form id="registrationForm">

        <!-- Full Name -->
        <label for="fullName">Full Name:</label>

        <input
                type="text"
                id="fullName"
                placeholder="Enter your full name"
        >

        <small id="nameError"></small>


        <!-- Email Address -->
        <label for="email">Email Address:</label>

        <input
                type="text"
                id="email"
                placeholder="Enter your email"
        >

        <small id="emailError"></small>


        <!-- Phone Number -->
        <label for="phone">Phone Number:</label>

        <input
                type="text"
                id="phone"
                placeholder="Enter your phone number"
        >

        <small id="phoneError"></small>


        <!-- Age -->
        <label for="age">Age:</label>

        <input
                type="number"
                id="age"
                placeholder="Enter your age"
        >

        <small id="ageError"></small>


        <!-- Course Selection -->
        <label for="course">Select Course:</label>

        <select id="course">

            <option value="">Choose a course</option>

            <option value="Java Programming">
                Java Programming
            </option>

            <option value="Python Programming">
                Python Programming
            </option>

            <option value="Web Development">
                Web Development
            </option>

            <option value="Data Science">
                Data Science
            </option>

        </select>

        <small id="courseError"></small>


        <!-- Password -->
        <label for="password">Password:</label>

        <input
                type="password"
                id="password"
                placeholder="Create a password"
        >

        <small id="passwordError"></small>


        <!-- Confirm Password -->
        <label for="confirmPassword">Confirm Password:</label>

        <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
        >

        <small id="confirmPasswordError"></small>


        <!-- Submit Button -->
        <button type="submit">
            Register Student
        </button>

        <!-- Reset Button -->
        <button type="reset" id="resetButton">
            Clear Form
        </button>

    </form>

    <!-- General success message -->
    <div id="successMessage"></div>

    <!-- Registered student information -->
    <div id="studentDetails"></div>

</div>

<!-- Connecting external JavaScript -->
<script src="script.js"></script>

</body>

</html>
