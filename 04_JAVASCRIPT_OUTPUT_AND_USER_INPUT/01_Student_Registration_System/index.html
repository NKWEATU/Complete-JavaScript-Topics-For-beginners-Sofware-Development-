<!DOCTYPE html>
<html>
<head>

    <!-- Defines the character encoding -->
    <meta charset="UTF-8">

    <!-- Sets the webpage title -->
    <title>Student Registration System</title>

</head>
<body>

<!-- Main heading -->
<h1>Student Registration System</h1>

<!-- Student registration form -->
<h2>Enter Student Information</h2>

<!-- Input field for student name -->
<label>Student Name:</label>
<input type="text" id="studentName">

<br><br>

<!-- Input field for student age -->
<label>Student Age:</label>
<input type="number" id="studentAge">

<br><br>

<!-- Input field for student course -->
<label>Course:</label>
<input type="text" id="studentCourse">

<br><br>

<!-- Input field for registration fee -->
<label>Registration Fee:</label>
<input type="number" id="registrationFee">

<br><br>

<!-- Button to collect and display student information -->
<button onclick="registerStudent()">
    Register Student
</button>

<!-- Button to demonstrate alert output -->
<button onclick="showWelcomeMessage()">
    Show Welcome Message
</button>

<!-- Section for displaying student information -->
<h2>Registration Details</h2>

<div id="studentDetails"></div>

<!-- Section for displaying registration fee information -->
<h2>Fee Information</h2>

<p id="feeDetails"></p>

<!-- Connect external JavaScript file -->
<script src="script.js"></script>

</body>
</html>
