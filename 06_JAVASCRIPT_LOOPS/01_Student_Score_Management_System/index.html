<!DOCTYPE html>
<html>
<head>
    <title>Student Score Management System</title>
</head>
<body>

<!-- Main heading -->
<h1>Student Score Management System</h1>

<!-- Button to display student scores -->
<button onclick="displayStudents()">
    Display Student Scores
</button>

<!-- Button to calculate total and average -->
<button onclick="calculateScores()">
    Calculate Scores
</button>

<!-- Button to display students who passed -->
<button onclick="displayPassedStudents()">
    Display Passed Students
</button>

<!-- Section for displaying student information -->
<h2>Student Information</h2>
<div id="studentOutput"></div>

<!-- Section for displaying total and average -->
<h2>Score Summary</h2>
<p id="summaryOutput"></p>

<!-- Section for displaying passed students -->
<h2>Passed Students</h2>
<div id="passedOutput"></div>

<!-- Connect the external JavaScript file -->
<script src="script.js"></script>

</body>
</html>
