<!DOCTYPE html>
<html>
<head>
    <title>Student Information Management System</title>
</head>
<body>

<!-- Main heading -->
<h1>Student Information Management System</h1>

<!-- Student name input -->
<label for="studentName">Student Name:</label>
<input type="text" id="studentName">

<br><br>

<!-- Student age input -->
<label for="studentAge">Student Age:</label>
<input type="number" id="studentAge">

<br><br>

<!-- Student course input -->
<label for="studentCourse">Student Course:</label>
<input type="text" id="studentCourse">

<br><br>

<!-- Student email input -->
<label for="studentEmail">Student Email:</label>
<input type="email" id="studentEmail">

<br><br>

<!-- Button to create student object -->
<button onclick="createStudent()">
    Create Student
</button>

<!-- Button to display student information -->
<button onclick="displayStudent()">
    Display Student
</button>

<!-- Button to update student information -->
<button onclick="updateStudent()">
    Update Student
</button>

<!-- Button to delete student email property -->
<button onclick="deleteStudentEmail()">
    Delete Email
</button>

<hr>

<!-- Section for displaying student details -->
<h2>Student Information</h2>

<div id="studentOutput"></div>

<hr>

<!-- Section for displaying object properties -->
<h2>Object Properties</h2>

<div id="propertiesOutput"></div>

<hr>

<!-- Section for displaying multiple students -->
<h2>Registered Students</h2>

<div id="allStudentsOutput"></div>

<!-- Connect external JavaScript file -->
<script src="script.js"></script>

</body>
</html>
